services:
  immich-folder-albums:
    image: ghcr.io/yayuniversal/immich-folder-albums
    container_name: immich-folder-albums
    volumes:
      # Mount the external library at the same mountpoint immich sees it
      - /path/to/your/photos:/path/inside/immich:ro
    environment:
      IMMICH_API_URL: <IMMICH_API_URL>
      IMMICH_API_KEY: <IMMICH_API_KEY>
      
      # Set to 1 for debug output. Default (unset or 0) is info-level.
      VERBOSE: 1

      # Uncomment to suppress info and debug output (only show warnings and errors)
      # Takes precedence over VERBOSE.
      #QUIET: 1

      # Cron expression for scheduled run
      # The following example runs the script every day at 2:00AM
      CRON_EXPRESSION: "0 2 * * *"

      # Uncomment to set a regex to preprocess each album name from its folder name
      # The input of the regex will be the folder name (not the full path), and the output will be used as the album name
      #ALBUM_NAME_REGEX:

      # Uncomment to add assets to albums by chunks of API_CHUNK_SIZE assets maximum per API call
      # Useful if large albums fail
      #API_CHUNK_SIZE: 1000

      # Uncomment for dry run
      # Accepts true/false, 0/1, or any non-empty string (enabled).
      #DRY_RUN: 1

      # Uncomment to delete all existing albums before creating the new ones.
      # /!\ This will be done each time the script runs! So it will actually reset all your albums each time
      # Accepts true/false, 0/1, or any non-empty string (enabled).
      #DELETE_ALL_ALBUMS: 1
